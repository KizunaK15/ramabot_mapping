mapping_odom_bridge:
  ros__parameters:
    serial_port: "/dev/m5stack"
    baud_rate: 115200
    odom_mode: "imu_direct"     # Membaca langsung ODO:x,y,theta,vx,vth dari M5Stack Core Grey
    wheel_separation: 0.230     # [METER] Jarak antar pusat roda kiri-kanan (sesuai TRACK_WIDTH)
    wheel_radius: 0.067         # [METER] Jari-jari roda (sesuai WHEEL_RADIUS)
    odom_frame: "odom"
    base_frame: "base_footprint"